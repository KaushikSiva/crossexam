[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossexam"
version = "0.1.0"
description = "Find broken software your evals accept. Prove stronger tests on unseen defects."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kaushik Sivakumar"}]
dependencies = []

[project.scripts]
crossexam = "crossexam.cli:main"

[tool.setuptools]
packages = ["crossexam"]
