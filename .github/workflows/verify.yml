name: Verify CrossExam
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  executable-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated candidate runtime
        run: docker pull python:3.12-slim
      - name: Verify isolation and promotion invariants
        run: python -m unittest discover -s tests -v
      - name: Install optional Fetch and MongoDB adapters
        run: pip install -r requirements-fetch-agent.txt
      - name: Verify signed agent receipts and frozen-suite execution
        run: python -m unittest discover -s tests -p test_fetch_agent.py -v
      - name: Reproduce the local campaign
        run: python -m crossexam run --out runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: crossexam-evidence
          path: runs/ci/
